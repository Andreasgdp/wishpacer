<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="favBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="favStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <linearGradient id="favLineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#favBgGrad)" />

  <path
    d="M 100 370 C 180 370, 220 310, 280 250 C 340 190, 360 160, 400 120"
    fill="none"
    stroke="url(#favLineGrad)"
    stroke-width="32"
    stroke-linecap="round"
  />

  <circle cx="120" cy="370" r="12" fill="#C084FC" opacity="0.6" />
  <circle cx="205" cy="325" r="14" fill="#A855F7" opacity="0.8" />
  <circle cx="295" cy="230" r="16" fill="#818CF8" />

  <g transform="translate(390, 115) scale(1.3)" filter="url(#favGlow)">
    <path
      d="M 0 -36 C 4 -12, 12 -4, 36 0 C 12 4, 4 12, 0 36 C -4 12, -12 4, -36 0 C -12 -4, -4 -12, 0 -36 Z"
      fill="url(#favStarGrad)"
    />
  </g>

  <g transform="translate(180, 180) scale(0.6)">
    <path
      d="M 0 -24 C 3 -8, 8 -3, 24 0 C 8 3, 3 8, 0 24 C -3 8, -8 3, -24 0 C -8 -3, -3 -8, 0 -24 Z"
      fill="#F472B6"
    />
  </g>
</svg>
