<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" fill="none">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="logoStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <linearGradient id="logoLineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="logoTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(20, 20)">
    <rect width="200" height="200" rx="48" fill="url(#logoBgGrad)" />

    <path
      d="M 40 145 C 70 145, 85 120, 110 95 C 135 70, 145 60, 160 45"
      fill="none"
      stroke="url(#logoLineGrad)"
      stroke-width="14"
      stroke-linecap="round"
    />

    <circle cx="48" cy="145" r="5" fill="#C084FC" opacity="0.7" />
    <circle cx="82" cy="128" r="6" fill="#A855F7" opacity="0.9" />
    <circle cx="118" cy="88" r="7" fill="#818CF8" />

    <g transform="translate(155, 42) scale(0.6)" filter="url(#logoGlow)">
      <path
        d="M 0 -36 C 4 -12, 12 -4, 36 0 C 12 4, 4 12, 0 36 C -4 12, -12 4, -36 0 C -12 -4, -4 -12, 0 -36 Z"
        fill="url(#logoStarGrad)"
      />
    </g>

    <g transform="translate(75, 70) scale(0.3)">
      <path
        d="M 0 -24 C 3 -8, 8 -3, 24 0 C 8 3, 3 8, 0 24 C -3 8, -8 3, -24 0 C -8 -3, -3 -8, 0 -24 Z"
        fill="#F472B6"
      />
    </g>
  </g>

  <!-- Brand Typography -->
  <text x="250" y="118" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="72" fill="url(#logoTextGrad)">
    Wish Pacing
  </text>
  <text x="252" y="165" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="24" fill="#64748B" letter-spacing="2">
    SMART SAVINGS &amp; WISHLIST PLANNER
  </text>
</svg>
